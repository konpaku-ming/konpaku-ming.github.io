name: Deploy academicpages and Hugo to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.154.5'
          extended: true

      - name: Setup Ruby and Jekyll
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          working-directory: academic
          bundler-cache: true

      - name: Check combined build helpers
        run: python3 -m unittest discover -s .github/scripts -p 'test_build_site.py' -v

      - name: Generate CV.pdf from cv-editor source
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir PyMuPDF PyYAML
          python3 scripts/build_cv_pdf.py \
            --data academic/_data/cv_editor.yml \
            --output academic/files/CV.pdf

      - name: Build academicpages and Hugo
        env:
          JEKYLL_ENV: production
        run: python3 scripts/build_site.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
