<div class="cv-editor" id="cv-editor">
  <div class="cv-editor__toolbar">
    <div>
      <p class="cv-editor__eyebrow">CURRICULUM VITAE</p>
      <h1>CV editor</h1>
      <p class="cv-editor__intro">Edit the fields on the left and preview the academic CV on the right.</p>
    </div>
    <div class="cv-editor__actions" aria-label="CV actions">
      <button class="cv-button cv-button--primary" type="button" data-action="print">Print / PDF</button>
      <button class="cv-button" type="button" data-action="export">Export JSON</button>
      <button class="cv-button" type="button" data-action="import">Import JSON</button>
      <button class="cv-button cv-button--quiet" type="button" data-action="reset">Reset</button>
      <input id="cv-import-file" type="file" accept="application/json,.json" hidden>
    </div>
  </div>

  <div class="cv-editor__workspace">
    <aside class="cv-editor__panel" aria-label="CV fields">
      <form id="cv-editor-form" class="cv-form"></form>
      <p class="cv-editor__hint">Edits are saved in this browser. Export the JSON or update <code>_data/cv.yml</code> to publish changes to the website.</p>
    </aside>

    <div class="cv-editor__preview-wrap">
      <div class="cv-editor__preview-label">Live preview</div>
      <article id="cv-preview" class="cv-paper" aria-label="CV preview"></article>
    </div>
  </div>

  <p id="cv-editor-status" class="cv-editor__status" role="status" aria-live="polite"></p>
</div>

<script id="cv-default-data" type="application/json">{{ site.data.cv_editor | jsonify }}</script>
