remote_theme: academicpages/academicpages.github.io@9e19e6318817bd3a6060a76d5af98124d394f3a0

locale: en-US
site_theme: default
title: Xuanming Ding
title_separator: "|"
name: Xuanming Ding
description: "Xuanming Ding — undergraduate student in the ACM Class at Shanghai Jiao Tong University."
og_image: avatar.jpg
favicon: favicon.svg
url: https://konpaku-ming.github.io
baseurl: /home
repository: konpaku-ming/konpaku-ming.github.io
timezone: Asia/Shanghai

author:
  name: Xuanming Ding
  avatar: avatar.jpg
  bio: "Undergraduate student · ACM Class"
  employer: Shanghai Jiao Tong University
  email: dxuanming@sjtu.edu.cn
  github: konpaku-ming

atom_feed:
  path: /blog/index.xml

breadcrumbs: false
words_per_minute: 160
read_more: disabled
comments:
  provider: false
analytics:
  provider: false

include:
  - _pages
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .bundle
  - .jekyll-cache
  - cv-editor

collections:
  publications:
    output: true
    permalink: /publication/:path/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  auto_ids: true
  syntax_highlighter: rouge
sass:
  sass_dir: _sass
  style: compressed

plugins:
  - jekyll-remote-theme
  - jekyll-sitemap

compress_html:
  clippings: all
  ignore:
    envs: development
